<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Cat</title><style>body{margin:0;background:#0d1020;color:white;font-family:system-ui;text-align:center}canvas{background:#9bdcff;border:2px solid #5964ff;max-width:92vw}</style><h1>🐱 Flappy Cat</h1><p>Space / click to flap.</p><canvas id=c width=420 height=600></canvas><p><button onclick="location.href='../index.html'">← Game Hub</button></p><script>let x=c.getContext('2d'),y=300,v=0,px=420,gap=180,top=180,score=0,dead=0;function flap(){if(dead){location.reload();return}v=-8}onkeydown=e=>{if(e.code==='Space')flap()};c.onclick=flap;function loop(){v+=.4;y+=v;px-=3;if(px<-60){px=420;top=70+Math.random()*300;score++}x.clearRect(0,0,420,600);x.fillStyle='#57b66b';x.fillRect(px,0,55,top);x.fillRect(px,top+gap,55,600);x.font='38px system-ui';x.fillText('🐱',100,y);x.fillStyle='#111';x.font='22px system-ui';x.fillText('Score: '+score,15,30);if(y<0||y>580||(px<135&&px+55>100&&(y<top||y>top+gap))){dead=1;x.fillText('Game over — click to restart',70,300)}else requestAnimationFrame(loop)}loop()</script>
