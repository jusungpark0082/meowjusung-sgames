<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Click Rush</title><style>body{margin:0;background:#0d1020;color:white;font-family:system-ui;text-align:center}button{font-size:22px;padding:18px 35px;border:0;border-radius:16px;cursor:pointer}#target{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}.hidden{display:none}</style><h1>⚡ Click Rush</h1><p>Click the target as many times as possible in 10 seconds.</p><h2 id=s>Score: 0</h2><button id=start onclick="go()">Start</button><button id=target class=hidden onclick="hit()">CLICK!</button><p><button onclick="location.href='../index.html'">← Game Hub</button></p><script>let n=0,end;function go(){n=0;document.getElementById('s').textContent='Score: 0';start.classList.add('hidden');target.classList.remove('hidden');end=Date.now()+10000;move();tick()}function hit(){if(Date.now()<end){n++;s.textContent='Score: '+n;move()}}function move(){target.style.left=(10+Math.random()*80)+'%';target.style.top=(20+Math.random()*65)+'%'}function tick(){if(Date.now()<end)setTimeout(tick,100);else{target.classList.add('hidden');start.classList.remove('hidden');alert('Time! Score: '+n)}}</script>
