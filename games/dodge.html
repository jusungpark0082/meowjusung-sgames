<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dodge</title><style>body{margin:0;background:#0d1020;color:white;font-family:system-ui;text-align:center}canvas{background:#11182b;border:2px solid #5964ff;max-width:92vw}</style><h1>💥 Dodge</h1><p>Move with ← → or A/D. Survive!</p><canvas id=c width=500 height=500></canvas><p><button onclick="location.href='../index.html'">← Game Hub</button></p><script>let x=c.getContext('2d'),px=230,obs=[],t=0,run=1;onkeydown=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')px-=25;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')px+=25;px=Math.max(0,Math.min(460,px))};function loop(){if(!run)return;t++;if(t%22===0)obs.push({x:Math.random()*460|0,y:-30,s:20+Math.random()*25});x.clearRect(0,0,500,500);x.fillStyle='#7c83ff';x.fillRect(px,460,40,25);x.fillStyle='#ff5d73';obs.forEach(o=>{o.y+=4;x.fillRect(o.x,o.y,o.s,o.s);if(o.y>435&&o.x<px+40&&o.x+o.s>px){run=0;alert('You survived '+Math.floor(t/60)+' seconds');location.reload()}});obs=obs.filter(o=>o.y<520);x.fillStyle='white';x.font='18px system-ui';x.fillText('Time: '+(t/60).toFixed(1),10,25);requestAnimationFrame(loop)}loop()</script>
