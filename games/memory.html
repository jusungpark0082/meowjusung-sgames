<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory</title><style>body{margin:0;background:#0d1020;color:white;font-family:system-ui;text-align:center}.grid{display:grid;grid-template-columns:repeat(4,80px);gap:10px;justify-content:center}.card{height:80px;background:#252b48;border:0;border-radius:12px;font-size:36px;cursor:pointer}.card.open{background:#5964ff}</style><h1>🧠 Memory</h1><p>Match all pairs.</p><div id=g class=grid></div><p><button onclick="location.href='../index.html'">← Game Hub</button></p><script>let vals=['🐱','🐶','🦊','🐸','🐼','🐵','🐯','🐙'];vals=[...vals,...vals].sort(()=>Math.random()-.5);let first=null,lock=false,matched=0;g.innerHTML=vals.map((v,i)=>`<button class=card onclick="flip(this,${i})">?</button>`).join('');function flip(el,i){if(lock||el.classList.contains('open'))return;el.textContent=vals[i];el.classList.add('open');if(!first){first={el,i};return}if(vals[i]===vals[first.i]){matched+=2;first=null;if(matched===vals.length)setTimeout(()=>alert('You won!'),200)}else{lock=true;let f=first;first=null;setTimeout(()=>{el.textContent='?';el.classList.remove('open');f.el.textContent='?';f.el.classList.remove('open');lock=false},650)}}</script>
