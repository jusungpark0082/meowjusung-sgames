<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mines — MeowJusung Games</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui;text-align:center}#g{display:grid;grid-template-columns:repeat(9,38px);gap:4px;justify-content:center}.c{width:38px;height:38px;border:0;border-radius:7px;background:#202944;color:#fff;font-weight:900;cursor:pointer}.c.open{background:#5964ff}.c.flag{background:#7c83ff}button.reset{margin:18px;padding:11px 16px;border:0;border-radius:11px;background:#7c83ff;color:#fff;font-weight:800}a{color:#aab0ff}</style><main><p><a href="../index.html">← Game Hub</a></p><h1>💣 Mines</h1><p>Click safe squares. Right-click to flag a mine.</p><h2 id=s>Safe: 0/71</h2><div id=g></div><button class=reset onclick="start()">New Board</button></main><script>const N=81,M=10;let mines,open,flags,over;function start(){mines=new Set();open=new Set();flags=new Set();over=0;while(mines.size<M)mines.add(Math.random()*N|0);draw()}function near(i){let r=Math.floor(i/9),c=i%9,n=[];for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){let rr=r+y,cc=c+x;if(rr>=0&&rr<9&&cc>=0&&cc<9&&(x||y))n.push(rr*9+cc)}return n}function count(i){return near(i).filter(x=>mines.has(x)).length}function reveal(i){if(over||open.has(i)||flags.has(i))return;if(mines.has(i)){open.add(i);over=1;draw();setTimeout(()=>alert('💥 Boom! Try again.'),20);return}open.add(i);if(count(i)===0)near(i).forEach(reveal)}function clickCell(i){reveal(i);if(open.size===N-M){over=1;draw();setTimeout(()=>alert('🎉 You cleared the board!'),20)}}function draw(){g.innerHTML=Array.from({length:N},(_,i)=>`<button class="c ${open.has(i)?'open':''} ${flags.has(i)?'flag':''}" onclick="clickCell(${i})" oncontextmenu="event.preventDefault();flag(${i})">${open.has(i)?(count(i)||''):(flags.has(i)?'⚑':'')}</button>`).join('');s.textContent=over?'Board finished':`Safe: ${open.size}/${N-M}`}function flag(i){if(over||open.has(i))return;flags.has(i)?flags.delete(i):flags.add(i);draw()}start()</script>
