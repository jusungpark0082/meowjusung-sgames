<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake — MeowJusung Games</title><style>body{margin:0;background:#0d1020;color:white;font-family:system-ui;text-align:center}main{max-width:600px;margin:30px auto}canvas{background:#11182b;border:2px solid #5964ff;border-radius:12px;max-width:92vw}button{padding:10px 16px;border:0;border-radius:10px;background:#747cff;color:white;font-weight:bold;cursor:pointer}a{color:#aab0ff}p{color:#aeb4ca}</style></head><body><main><p><a href="../index.html">← Game Hub</a></p><h1>🐍 Snake</h1><p>Use Arrow Keys or WASD. Eat red food!</p><p>Score: <b id="score">0</b></p><canvas id="c" width="480" height="480"></canvas><p><button onclick="start()">Restart</button></p></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),n=24,s=20;let snake,food,dx,dy,score,run;function start(){snake=[{x:12,y:12},{x:11,y:12}];food={x:18,y:12};dx=1;dy=0;score=0;document.getElementById('score').textContent=0;clearInterval(run);run=setInterval(tick,100)}function place(){do{food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function tick(){let h={x:snake[0].x+dx,y:snake[0].y+dy};if(h.x<0||h.y<0||h.x>=n||h.y>=n||snake.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(run);alert('Game over! Score: '+score);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent=score;place()}else snake.pop();draw()}function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#ff5d73';x.fillRect(food.x*s,food.y*s,s-2,s-2);x.fillStyle='#7c83ff';snake.forEach(p=>x.fillRect(p.x*s,p.y*s,s-2,s-2))}addEventListener('keydown',e=>{let k=e.key.toLowerCase(),a=k==='arrowup'||k==='w',b=k==='arrowdown'||k==='s',l=k==='arrowleft'||k==='a',r=k==='arrowright'||k==='d';if(a&&dy!==1){dx=0;dy=-1}if(b&&dy!==-1){dx=0;dy=1}if(l&&dx!==1){dx=-1;dy=0}if(r&&dx!==-1){dx=1;dy=0}});start()</script></body></html>
