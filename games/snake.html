<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake — MeowJusung Games</title><style>body{margin:0;background:#0b1020;color:white;font-family:system-ui;text-align:center}main{max-width:620px;margin:25px auto;padding:0 15px}canvas{width:min(480px,92vw);height:auto;background:#11182b;border:2px solid #5964ff;border-radius:16px}button{padding:11px 16px;border:0;border-radius:11px;background:#7c83ff;color:white;font-weight:800;cursor:pointer}a{color:#aab0ff}.bar{display:flex;justify-content:center;gap:25px;color:#aeb4ca}.pad{display:grid;grid-template-columns:repeat(3,55px);gap:6px;justify-content:center;margin-top:12px}.pad button{padding:13px}.blank{visibility:hidden}</style></head><body><main><p><a href="../index.html">← Game Hub</a></p><h1>🐍 Snake</h1><p>Arrow keys/WASD or the touch pad. Eat food and don't hit yourself.</p><div class=bar><span>Score: <b id=score>0</b></span><span>Best: <b id=best>0</b></span></div><canvas id=c width=480 height=480></canvas><div class=pad><button class=blank></button><button onclick="turn(0,-1)">▲</button><button class=blank></button><button onclick="turn(-1,0)">◀</button><button onclick="start()">↻</button><button onclick="turn(1,0)">▶</button><button class=blank></button><button onclick="turn(0,1)">▼</button><button class=blank></button></div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),n=24,s=20;let snake,food,dx,dy,score,run,over;best.textContent=localStorage.snakeBest||0;function start(){clearInterval(run);snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dx=1;dy=0;score=0;over=0;scoreEl();place();draw();run=setInterval(tick,95)}function scoreEl(){scoreEl2=score;document.getElementById('score').textContent=score}function place(){do food={x:Math.random()*n|0,y:Math.random()*n|0};while(snake.some(p=>p.x===food.x&&p.y===food.y))}function turn(a,b){if(a&&dx===-a||b&&dy===-b)return;dx=a;dy=b}function tick(){let h={x:snake[0].x+dx,y:snake[0].y+dy};if(h.x<0||h.y<0||h.x>=n||h.y>=n||snake.some(p=>p.x===h.x&&p.y===h.y)){over=1;clearInterval(run);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl();if(score>+(localStorage.snakeBest||0)){localStorage.snakeBest=score;best.textContent=score}place()}else snake.pop();draw()}function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#ff5d73';x.fillRect(food.x*s,food.y*s,s-2,s-2);x.fillStyle='#7c83ff';snake.forEach(p=>x.fillRect(p.x*s,p.y*s,s-2,s-2));if(over){x.fillStyle='white';x.font='bold 28px system-ui';x.textAlign='center';x.fillText('Game over — press ↻',240,245);x.textAlign='left'}}addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')turn(0,-1);if(k==='arrowdown'||k==='s')turn(0,1);if(k==='arrowleft'||k==='a')turn(-1,0);if(k==='arrowright'||k==='d')turn(1,0);if(e.code==='Space'&&over)start()});start()</script></body></html>
