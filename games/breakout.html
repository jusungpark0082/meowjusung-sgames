<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breakout — MeowJusung Games</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui;text-align:center}canvas{width:min(620px,94vw);height:auto;background:#11182b;border:2px solid #5964ff;border-radius:16px}button{padding:11px 16px;border:0;border-radius:11px;background:#7c83ff;color:#fff;font-weight:800;cursor:pointer}a{color:#aab0ff}</style><main><p><a href="../index.html">← Game Hub</a></p><h1>🧱 Breakout</h1><p>Move with ← →, A/D, or your mouse. Clear every brick!</p><h2 id=s>Score: 0</h2><canvas id=c width=620 height=500></canvas><p><button onclick="start()">Restart</button></p></main><script>const c=document.getElementById('c'),g=c.getContext('2d');let px,ball,bricks,run;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')px-=30;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')px+=30;px=Math.max(0,Math.min(520,px))});c.onmousemove=e=>{const r=c.getBoundingClientRect();px=(e.clientX-r.left)*620/r.width-50;px=Math.max(0,Math.min(520,px))};function start(){px=260;ball={x:310,y:430,vx:4,vy:-4};bricks=[];for(let r=0;r<5;r++)for(let q=0;q<9;q++)bricks.push({x:20+q*66,y:35+r*25,on:1});run=1;loop()}function loop(){if(!run)return;ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<8||ball.x>612)ball.vx*=-1;if(ball.y<8)ball.vy*=-1;if(ball.y>455&&ball.y<480&&ball.x>px&&ball.x<px+100)ball.vy=-Math.abs(ball.vy),ball.vx+=(ball.x-px-50)/20;for(const b of bricks)if(b.on&&ball.x>b.x&&ball.x<b.x+60&&ball.y>b.y&&ball.y<b.y+18){b.on=0;ball.vy*=-1;const n=bricks.filter(z=>z.on).length;s.textContent='Score: '+(45-n)}if(ball.y>500){run=0;alert('Game over! Restart and try again.')}if(!bricks.some(b=>b.on)){run=0;alert('You cleared the board!')}g.clearRect(0,0,620,500);g.fillStyle='#5964ff';bricks.forEach(b=>{if(b.on)g.fillRect(b.x,b.y,60,18)});g.fillStyle='white';g.fillRect(px,465,100,12);g.beginPath();g.arc(ball.x,ball.y,8,0,7);g.fill();requestAnimationFrame(loop)}start()</script>
