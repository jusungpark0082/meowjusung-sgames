<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 — MeowJusung Games</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui;text-align:center}#g{width:340px;max-width:92vw;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#222b47;padding:8px;border-radius:15px}.t{aspect-ratio:1;border:0;border-radius:10px;background:#151c31;color:white;font-size:25px;font-weight:900}.on{background:#5964ff}.new{margin:15px;padding:11px 16px;border:0;border-radius:11px;background:#7c83ff;color:white;font-weight:800}a{color:#aab0ff}</style><main><p><a href="../index.html">← Game Hub</a></p><h1>🔢 2048</h1><p>Use arrow keys or swipe. Combine equal tiles to reach 2048.</p><h2 id=s>Score: 0</h2><div id=g></div><button class=new onclick="start()">New Game</button></main><script>let a,score=0;function start(){a=Array(16).fill(0);score=0;add();add();draw()}function add(){let e=a.map((v,i)=>v?null:i).filter(i=>i!==null);if(e.length)a[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}function draw(){g.innerHTML=a.map(v=>`<button class="t ${v?'on':''}">${v||''}</button>`).join('');s.textContent='Score: '+score}function move(dir){let old=a.join();let rows=[];for(let r=0;r<4;r++)rows.push(a.slice(r*4,r*4+4));if(dir==='up'||dir==='down'){rows=rows[0].map((_,c)=>rows.map(r=>r[c]));if(dir==='down')rows.forEach(r=>r.reverse())}if(dir==='right')rows.forEach(r=>r.reverse());rows=rows.map(r=>{r=r.filter(Boolean);for(let i=0;i<r.length-1;i++)if(r[i]===r[i+1]){r[i]*=2;score+=r[i];r.splice(i+1,1)}while(r.length<4)r.push(0);return r});if(dir==='right'||dir==='down')rows.forEach(r=>r.reverse());if(dir==='up'||dir==='down')rows=rows[0].map((_,c)=>rows.map(r=>r[c]));a=rows.flat();if(a.join()!==old){add();draw();if(!a.includes(2048)&&!canMove()){setTimeout(()=>alert('No more moves! Score: '+score),50)}}}function canMove(){for(let i=0;i<16;i++){if(!a[i])return true;if(i%4<3&&a[i]===a[i+1])return true;if(i<12&&a[i]===a[i+4])return true}return false}addEventListener('keydown',e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(m){e.preventDefault();move(m)}});let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});start()</script>
