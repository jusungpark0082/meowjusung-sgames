<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drift</title><style>body{margin:0;background:#0d1020;color:white;font-family:system-ui;text-align:center}canvas{background:#24352a;border:2px solid #5964ff;max-width:92vw}</style><h1>🏎️ Drift</h1><p>Steer with ← →. Stay on the road!</p><canvas id=c width="500" height="650"></canvas><p><button onclick="location.href='../index.html'">← Game Hub</button></p><script>let x=c.getContext('2d'),car=230,road=130,t=0,alive=1;onkeydown=e=>{if(e.key==='ArrowLeft')car-=18;if(e.key==='ArrowRight')car+=18};function loop(){if(!alive)return;t++;road=130+Math.sin(t/70)*80;x.clearRect(0,0,500,650);x.fillStyle='#222';x.fillRect(road,0,240,650);x.strokeStyle='white';x.setLineDash([30,25]);x.lineWidth=4;x.beginPath();x.moveTo(road+120,0);x.lineTo(road+120,650);x.stroke();x.setLineDash([]);x.fillStyle='#ff5d73';x.fillRect(car,540,40,70);x.fillStyle='white';x.font='22px system-ui';x.fillText('Score: '+t,15,30);if(car<road||car>road+200){alive=0;alert('Crash! Score: '+t)}else requestAnimationFrame(loop)}loop()</script>
