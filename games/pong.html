<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong</title><style>body{margin:0;background:#0d1020;color:white;font-family:system-ui;text-align:center}canvas{background:#11182b;border:2px solid #5964ff;max-width:92vw}button{padding:10px 16px;border:0;border-radius:10px;cursor:pointer}</style><h1>🏓 Pong</h1><p>Move with W/S or ↑/↓</p><canvas id=c width=700 height=400></canvas><p><button onclick="location.href='../index.html'">← Game Hub</button> <button onclick="start()">Restart</button></p><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),py=170,ay=170,bx=350,by=200,vx=5,vy=3,score=0,keys={};onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;function start(){py=170;ay=170;bx=350;by=200;vx=5;vy=3;score=0}function loop(){if(keys.w||keys.arrowup)py-=6;if(keys.s||keys.arrowdown)py+=6;py=Math.max(0,Math.min(320,py));ay+=by<ay?3:-3;ay=Math.max(0,Math.min(320,ay));bx+=vx;by+=vy;if(by<0||by>390)vy*=-1;if(bx<35&&by>py&&by<py+80){vx=Math.abs(vx);vy+=(by-py-40)/30;score++}if(bx>665&&by>ay&&by<ay+80)vx=-Math.abs(vx);if(bx<0||bx>700){if(bx<0)alert('Game over! Score: '+score);start()}x.clearRect(0,0,700,400);x.fillStyle='white';x.fillRect(20,py,15,80);x.fillRect(665,ay,15,80);x.beginPath();x.arc(bx,by,9,0,7);x.fill();x.font='28px system-ui';x.fillText(score,335,40);requestAnimationFrame(loop)}loop()</script>
