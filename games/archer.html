<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archer</title><style>body{margin:0;background:#0d1020;color:white;font-family:system-ui;text-align:center}canvas{background:#17213a;border:2px solid #5964ff;max-width:92vw}</style><h1>🏹 Archer</h1><p>Click where you want to shoot. Hit the moving target!</p><canvas id=c width=600 height=400></canvas><p><button onclick="location.href='../index.html'">← Game Hub</button></p><script>let x=c.getContext('2d'),tx=500,ty=200,score=0; c.onclick=e=>{let r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;if(Math.hypot(mx-tx,my-ty)<35){score++;tx=80+Math.random()*440;ty=60+Math.random()*280}else{score=Math.max(0,score-1)}draw()};function draw(){x.clearRect(0,0,600,400);x.strokeStyle='white';x.beginPath();x.moveTo(30,200);x.lineTo(140,200);x.stroke();x.fillStyle='#ff5d73';x.beginPath();x.arc(tx,ty,35,0,7);x.fill();x.fillStyle='white';x.beginPath();x.arc(tx,ty,12,0,7);x.fill();x.font='22px system-ui';x.fillText('Score: '+score,15,30)}draw()</script>
