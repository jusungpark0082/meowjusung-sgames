<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic-Tac-Toe — MeowJusung Games</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui;text-align:center}#b{display:grid;grid-template-columns:repeat(3,100px);gap:10px;justify-content:center}.cell{width:100px;height:100px;font-size:45px;border:1px solid #384364;border-radius:16px;background:#171e34;color:#fff;cursor:pointer}.cell:hover{border-color:#7c83ff}button.reset{margin-top:20px;padding:11px 16px;border:0;border-radius:11px;background:#7c83ff;color:#fff;font-weight:800}a{color:#aab0ff}</style><main><p><a href="../index.html">← Game Hub</a></p><h1>❌ Tic-Tac-Toe</h1><p id=s>Your turn — you are X</p><div id=b></div><button class=reset onclick="start()">Restart</button></main><script>let board,over;function start(){board=Array(9).fill('');over=0;draw()}function draw(){b.innerHTML=board.map((v,i)=>`<button class=cell onclick="move(${i})">${v}</button>`).join('');s.textContent=over?'Game over — press Restart':'Your turn — you are X'}function win(p){return[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>a.every(i=>board[i]===p))}function move(i){if(over||board[i])return;board[i]='X';if(win('X')){over=1;s.textContent='🎉 You win!';draw();return}if(!board.includes('')){over=1;s.textContent="It's a draw!";draw();return}let empty=board.map((v,i)=>v?null:i).filter(i=>i!==null),best=empty.find(i=>{board[i]='O';let w=win('O');board[i]='';return w});let pick=best??empty[Math.floor(Math.random()*empty.length)];board[pick]='O';if(win('O')){over=1;s.textContent='CPU wins — try again!'}else if(!board.includes('')){over=1;s.textContent="It's a draw!"}draw()}start()</script>
